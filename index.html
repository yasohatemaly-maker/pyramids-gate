<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyramids Gate Co. For Import, Export and General Supplies – Dubai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sand:    #F5EFE0;
    --clay:    #C8874A;
    --deep:    #1A1208;
    --spice:   #8B3A0F;
    --mint:    #3D7A5E;
    --cream:   #FBF7EE;
    --text:    #2C1F0E;
    --muted:   #7A6A55;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 48px;
    background: rgba(26,18,8,0.92);
    backdrop-filter: blur(8px);
  }
  .nav-logo-container {
    display: flex; align-items: center; gap: 14px; text-decoration: none;
  }
  .nav-logo-img {
    height: 38px; width: auto; object-fit: contain;
  }
  .nav-logo-text {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.75rem;
    color: #fff; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.3;
  }
  .nav-logo-text span {
    display: block; font-size: 0.6rem; color: var(--clay); font-weight: 400; letter-spacing: 0.12em;
  }

  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--clay); }
  .nav-cta {
    background: var(--clay); color: #fff; border: none; padding: 10px 22px;
    font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    font-family: 'Inter', sans-serif; text-decoration: none; transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--spice); }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: var(--deep);
    display: grid; grid-template-columns: 1fr 1fr; align-items: center;
    padding: 120px 48px 80px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: 'بوابة الأهرام';
    position: absolute; right: -60px; top: 50%;
    transform: translateY(-50%) rotate(-5deg);
    font-family: 'Scheherazade New', serif;
    font-size: clamp(6rem, 14vw, 18rem);
    color: rgba(200,135,74,0.06);
    line-height: 1; pointer-events: none;
    white-space: nowrap;
  }
  .hero-text { position: relative; z-index: 2; }
  .hero-eyebrow {
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--clay); margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
  }
  .hero-eyebrow::before { content: ''; display: block; width: 32px; height: 1px; background: var(--clay); }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 4.5vw, 4rem);
    color: #fff; line-height: 1.12; font-weight: 700;
    margin-bottom: 28px;
  }
  .hero h1 em { color: var(--clay); font-style: italic; }
  .hero-sub {
    color: rgba(255,255,255,0.55); font-size: 1.05rem; line-height: 1.65;
    max-width: 460px; margin-bottom: 44px;
  }
  .hero-actions { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn-primary {
    background: var(--clay); color: #fff; text-decoration: none;
    padding: 14px 32px; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--spice); }
  .btn-outline {
    border: 1px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.8);
    text-decoration: none; padding: 14px 32px; font-size: 0.85rem;
    letter-spacing: 0.1em; text-transform: uppercase; transition: border-color 0.2s, color 0.2s;
  }
  .btn-outline:hover { border-color: var(--clay); color: var(--clay); }

  .hero-visual {
    display: flex; flex-direction: column; align-items: flex-end; gap: 20px;
    position: relative; z-index: 2;
  }
  .hero-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(200,135,74,0.2);
    padding: 24px 32px; max-width: 320px; width: 100%;
  }
  .hero-card-label { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--clay); margin-bottom: 8px; }
  .hero-card-value { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #fff; }
  .hero-card-sub { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 4px; }

  /* ── TICKER ── */
  .ticker {
    background: var(--spice); color: rgba(255,255,255,0.85);
    overflow: hidden; white-space: nowrap; padding: 10px 0;
    font-size: 0.8rem; letter-spacing: 0.1em;
  }
  .ticker-inner {
    display: inline-block;
    animation: ticker 32s linear infinite;
  }
  .ticker-inner span { margin: 0 40px; }
  .ticker-inner .dot { color: rgba(255,255,255,0.4); margin: 0; }
  @keyframes ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ── SECTION STYLES ── */
  .section { padding: 100px 48px; }
  .section-label {
    font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--clay); margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  }
  .section-label::before { content: ''; display: block; width: 24px; height: 1px; background: var(--clay); }
  h2 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 3.5vw, 2.8rem); font-weight: 700;
    color: var(--deep); line-height: 1.2; margin-bottom: 24px;
  }

  /* ── ABOUT ── */
  .about {
    display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
    background: var(--sand);
  }
  .about-body { font-size: 1rem; line-height: 1.75; color: var(--muted); margin-bottom: 24px; }
  .about-arabic {
    font-family: 'Scheherazade New', serif;
    font-size: clamp(3rem, 8vw, 7rem); color: var(--clay); opacity: 0.18;
    line-height: 1; margin-bottom: 12px; direction: rtl;
  }
  .about-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .about-stat { background: var(--deep); padding: 28px 24px; }
  .about-stat-n { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--clay); }
  .about-stat-l { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 4px; letter-spacing: 0.05em; }

  /* ── BRANDS / PORTFOLIO ── */
  .brands-section { background: var(--deep); color: #fff; }
  .brands-section h2 { color: #fff; }
  .brands-section .section-label::before { background: var(--clay); }
  .brands-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 48px;
  }
  .brand-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(200,135,74,0.2);
    padding: 32px 24px; text-align: center; transition: background 0.2s, border-color 0.2s;
  }
  .brand-card:hover { background: rgba(200,135,74,0.1); border-color: var(--clay); }
  .brand-tag { font-size: 0.65rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--clay); margin-bottom: 8px; }
  .brand-name { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #fff; margin-bottom: 8px; }
  .brand-desc { font-size: 0.8rem; color: rgba(255,255,255,0.5); line-height: 1.5; }

  /* ── FEATURED PRODUCTS SHOWCASE ── */
  .showcase { background: var(--cream); }
  .showcase-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 48px;
  }
  .product-showcase-card {
    background: var(--sand); border: 1px solid rgba(200,135,74,0.2);
    display: flex; flex-direction: column; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
  }
  .product-showcase-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(26,18,8,0.08);
  }
  .product-img-wrapper {
    background: #fff; height: 260px; display: flex; align-items: center; justify-content: center;
    padding: 20px; border-bottom: 1px solid rgba(200,135,74,0.15); position: relative;
  }
  .product-img-wrapper img {
    max-height: 220px; width: auto; object-fit: contain;
  }
  .product-content { padding: 28px; display: flex; flex-direction
